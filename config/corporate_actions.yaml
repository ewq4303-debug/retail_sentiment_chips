# 公司行動行事曆（SPEC §2.1）。
# 比例型指標（散戶比 sr / 大戶比 hb）用「佔庫存 %」計算，對等比例行動免疫。
# 流量錨定（§4）需要股數差 → 此處的 adj_factor 用來把各週 shares 還原到調整後共同基準。
#
# 格式：
#   <stock_id>:
#     - ex_date: "YYYY-MM-DD"   # 除權息/分割/減資生效日
#       adj_factor: 1.0          # 該日(含)之後的歷史股數需乘上的累積調整因子
#       note: "說明"
#
# 範例（無實際行動時留空 dict）：
# 2330:
#   - ex_date: "2025-06-12"
#     adj_factor: 1.0
#     note: "現金股利，股數不變"
